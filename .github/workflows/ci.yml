name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check local_research_agent tests
      - name: Run tests
        run: |
          set +e
          python -m pytest --cov=local_research_agent --cov-report=term-missing --junitxml=pytest-results.xml
          test_status=$?
          if [ -f pytest-results.xml ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-results.xml").getroot()
          for case in root.iter("testcase"):
              for outcome in ("failure", "error"):
                  detail = case.find(outcome)
                  if detail is None:
                      continue
                  name = f"{case.get('classname', '')}::{case.get('name', 'unknown')}"
                  message = detail.get("message", "") + "\n" + (detail.text or "")
                  message = message[:4000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Pytest {outcome}: {name}::{message}")
          PY
          fi
          exit "$test_status"
